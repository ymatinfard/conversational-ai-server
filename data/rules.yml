version: "3.1"

rules:
  - rule: Start order form
    steps:
      - intent: start_order
      - action: order_form
      - active_loop: order_form

  - rule: Submit order form
    condition:
      - active_loop: order_form
    steps:
      - action: order_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: utter_order_confirmation

