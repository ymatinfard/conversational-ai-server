version: "3.1"
rules:
- rule: Greet user
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Check order status
  steps:
  - intent: check_order_status
  - action: action_check_order_status

- rule: Cancel order
  steps:
  - intent: cancel_order
  - action: action_cancel_order
