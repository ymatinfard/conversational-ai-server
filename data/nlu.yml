version: "3.1"
nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - good morning
    - hey

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - catch you later

- intent: affirm
  examples: |
    - yes
    - sure
    - of course
    - definitely

- intent: deny
  examples: |
    - no
    - not really
    - I don't think so

- intent: start_order
  examples: |
    - I want to place an order
    - Can I order food?
    - Let's start an order

- intent: order_food
  examples: |
    - I want to order [burger](food_item) and [fries](food_item)
    - Can I get a [burger](food_item) and [fries](food_item)?
    - I would like to order a [pizza](food_item)
    - I need a [vegan meal](food_item)
    - I want [chicken biryani](food_item) and [coke](food_item)

- intent: add_to_order
  examples: |
    - add a [coke](food_item)
    - also get me some [fries](food_item)
    - include a [salad](food_item)
    - I want an extra [burger](food_item)

- intent: remove_from_order
  examples: |
    - remove the [fries](food_item)
    - cancel the [drink](food_item)
    - take out the [salad](food_item)

- intent: check_order_status
  examples: |
    - Where is my order?
    - Is my food on the way?
    - Track my order
    - How long will it take?

- intent: cancel_order
  examples: |
    - Cancel delivering food
    - Cancel the order
    - Cancel my order
    - I want to cancel my order
    - Cancel everything
    - Stop the order please
    - Abort the order
    - Cancel the whole things
    - Don't deliver anything
    - I'd like to call off the order

- intent: provide_address
  examples: |
    - My address is [123 Main Street](address)
    - Deliver it to [5th Avenue](address)
    - Send it to [45 Elm St.](address)
    - Address is [a street in Messina](address)

- intent: provide_payment_method
  examples: |
    - I'll pay by [card](payment_method)
    - [Cash on delivery](payment_method)
    - Use my saved [wallet](payment_method)

- intent: modify_order
  examples: |
    - no salt please
    - make it spicy
    - don't make it spicy
    - no meat
    - no onions please

- intent: feedback_positive
  examples: |
    - that was great
    - delicious food
    - I'm happy
    - amazing service

- intent: feedback_negative
  examples: |
    - food was cold
    - I'm not happy
    - poor service
    - late delivery
